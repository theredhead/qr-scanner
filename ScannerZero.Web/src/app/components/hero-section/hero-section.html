<section class="hero">
  <div class="hero-copy">
    <p class="eyebrow">Free. Local. Private.</p>
    <h1>ScannerZero</h1>
    <p class="lede">
      A simple barcode scanner that shows you what a code contains without ads,
      accounts, tracking, or sending your scans to somebody else's server.
    </p>
    <div class="hero-actions" aria-label="Primary actions">
      <a class="button primary" [href]="releasesUrl">Download builds</a>
      <a class="button secondary" [href]="repositoryUrl">View source</a>
    </div>
  </div>

  <div class="hero-visual" aria-label="ScannerZero app artwork">
    <img src="/assets/splash-screen.png" width="852" height="1846" alt="ScannerZero artwork">
  </div>
</section>
